<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#e3dfd5;--acc:#2f5bea;--ok:#1f9d63;--okb:#e5f6ed;--bad:#d64545;--badb:#fdeaea}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1d222d;--ink:#e8ebf2;--mut:#98a1b5;--line:#2c3342;--acc:#7b9bff;--ok:#4cc38a;--okb:#16352a;--bad:#ff7a7a;--badb:#3a1f22}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:15px;margin:18px 0 8px;color:var(--mut);font-weight:600}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.stats{display:flex;gap:8px}.stats div{flex:1;text-align:center;padding:10px 4px}.stats b{display:block;font-size:22px}.stats span{font-size:12px;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.chip.on{border-color:var(--acc);background:var(--acc);color:#fff}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff;width:100%;padding:13px;font-size:17px;font-weight:600;margin-top:10px}
.btn.ghost{width:100%;margin-top:8px}
details{margin:6px 0}summary{cursor:pointer;font-weight:600;padding:6px 0}
.ch{display:flex;justify-content:space-between;width:100%;text-align:left;margin:4px 0;font-size:14px}
.ch small{color:var(--mut);white-space:nowrap;margin-left:8px}.ch.on small{color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.tag{display:inline-block;font-size:12px;background:var(--line);border-radius:6px;padding:1px 8px;margin:6px 6px 0 0}
.q{font-size:17px;font-weight:600;margin:10px 0}
.sent{font-size:19px;line-height:1.5;margin:8px 0}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;font-size:18px;line-height:1.45;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:13px;margin:10px 0;cursor:pointer}
.opt b{color:var(--mut)}.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.bad{border-color:var(--bad);background:var(--badb)}
.opt:disabled{cursor:default;color:var(--ink)}
mark{border-radius:4px;padding:0 3px}mark.ok{background:var(--ok);color:#fff}mark.bad{background:var(--bad);color:#fff}
.ex p{margin:6px 0}.ex .l{font-size:13px;color:var(--mut)}.ex .why{font-size:16px}
.more{font-size:14px;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}.more p{margin:4px 0}.more span{color:var(--mut)}
.hide{display:none}.res b{font-size:40px}
</style></head><body><main id="app"></main>

 plays an important role in our growth.","There is no doubt that reading plays an important role in our growth.","there is no doubt that固定句型。","",0],[1492,"He insisted that he is innocent and that he should set free at once.","He insisted that he was innocent and that he (should) be set free at once.","insist表坚持认为事实用陈述；坚决要求用虚拟被动(should) be done。","",0],[1493,"Considered everything, his performance in the contest deserves praise.","Considering everything, his performance in the contest deserves praise.","considering介词“考虑到”。","",0],[1494,"Hardly did he arrive home when it began to pour with heavy rain.","Hardly had he arrived home when it began to pour with heavy rain.","hardly…when句型hardly后用过去完成时had done。","",0],[1495,"Seeing from the top of the mountain, the whole city looks extremely magnificent.","Seen from the top of the mountain, the whole city looks extremely magnificent.","city是被看，过去分词作状语seen。","",0],[1496,"One of the student who took part in the contest won the national prize.","One of the students who took part in the contest won the national prize.","one of后接复数名词students。","",0],[1497,"It was in this bookstore where I bought my favourite science-fiction novel.","It was in this bookstore that I bought my favourite science-fiction novel.","强调地点介词短语，强调句型用that不用where。","",0],[1498,"Having finished his written work, the computer was shut down by him.","Having finished his written work, he shut down the computer.","having done逻辑主语必须是人he，不能是computer。","",0],[1499,"The reason why he turned down the offer is because the salary was too low.","The reason why he turned down the offer is that the salary was too low.","the reason…is that固定表语从句，不用because。","",0],[1500,"Not only he gained knowledge from the activity but also he made many new friends.","Not only did he gain knowledge from the activity but also he made many new friends.","not only置于句首，前半分句部分倒装。","",0]]};
const C=D.c,Q=D.q; // Q: [id,错句,正句,原因,提示,是否本身正确]
const KEY='grammar-quiz-v1',$=s=>document.querySelector(s),app=$('#app');
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mastered=id=>(S[id]&&S[id].s||0)>=2;
const chIdx=id=>C.findIndex(c=>id>=c.a&&id<=c.b);
const vol=a=>a<=300?'初中第一册 1–300':a<=600?'初中第二册 301–600':a<=900?'初中第三册 601–900':a<=1200?'高中第一册 901–1200':'高中第二册 1201–1500';
let N=10;try{N=+localStorage.getItem('gq-n')||10}catch(e){}
let H=[];try{H=JSON.parse(localStorage.getItem('gq-h'))||[]}catch(e){}
let sel='all',mode='smart',round=[],pos=0,score=0,miss=[],opts=[],done=false;

function diff(a,b,cls){const A=a.split(/\s+/),B=b.split(/\s+/),n=A.length,m=B.length;
const L=Array.from({length:n+1},()=>Array(m+1).fill(0));
for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
let i=0,j=0,o=[];while(i<n){if(j<m&&A[i]===B[j]){o.push(esc(A[i]));i++;j++}
else if(j<m&&L[i][j+1]>=L[i+1][j])j++;else{o.push('<mark class="'+cls+'">'+esc(A[i])+'</mark>');i++}}
return o.join(' ')}

function home(){
 const seen=Q.filter(q=>S[q[0]]),m=Q.filter(q=>mastered(q[0])).length,w=Q.filter(q=>S[q[0]]&&S[q[0]].w&&!mastered(q[0])).length;
 let h=`<h1>英语语法闯关</h1><p class="sub">1500 道错题 · 初中+高中 · 选对句 · 附知识点讲解</p>
 <div class="card"><div class="stats"><div><b>${m}</b><span>已掌握</span></div><div><b>${w}</b><span>待攻克错题</span></div><div><b>${seen.length}</b><span>已做过</span></div></div>
 <div class="bar"><i style="width:${m/15}%"></i></div><div class="sub" style="margin:0">连续答对 2 次视为“已掌握”，错题会优先再出现。</div></div>
 ${H.length?`<div class="card sub" style="margin:10px 0"><b style="color:var(--ink)">最近成绩</b><br>${H.slice(-5).reverse().map(x=>`${x[0]} · <b style="color:var(--ink)">${x[1]} 分</b>（${x[2]} 题）`).join('<br>')}</div>`:''}
 <h2>出题方式</h2><div class="seg">${[['smart','智能（错题优先）'],['seq','按顺序'],['wrong','只练错题']].map(x=>`<button class="chip ${mode==x[0]?'on':''}" onclick="mode='${x[0]}';home()">${x[1]}</button>`).join('')}</div>
 <h2>每轮题数</h2><div class="seg">${[5,10,15,20,30,50].map(n=>`<button class="chip ${N===n?'on':''}" onclick="N=${n};try{localStorage.setItem('gq-n',N)}catch(e){}home()">${n} 题</button>`).join('')}</div>
 <h2>选择专题</h2><button class="chip ch ${sel==='all'?'on':''}" onclick="sel='all';home()"><span>全部 1500 题</span><small>${m}/1500</small></button>`;
 let last='';C.forEach((c,i)=>{const v=vol(c.a);if(v!==last){if(last)h+='</details>';h+=`<details ${sel!=='all'&&vol(C[sel].a)===v?'open':''}><summary>${v}</summary>`;last=v}
  const t=Q.filter(q=>q[0]>=c.a&&q[0]<=c.b),k=t.filter(q=>mastered(q[0])).length;
  h+=`<button class="chip ch ${sel===i?'on':''}" onclick="sel=${i};home()"><span>${esc(c.t)}</span><small>${k}/${t.length}</small></button>`});
 h+=`</details><button class="btn main" onclick="start()">开始练习（${N} 题）</button><button class="btn ghost" onclick="if(confirm('确定清空所有学习进度？'))S={},save(),home()">清空进度</button>`;
 app.innerHTML=h;window.scrollTo(0,0)}

function start(){
 let pool=Q.filter(q=>sel==='all'||(q[0]>=C[sel].a&&q[0]<=C[sel].b));
 if(mode==='wrong')pool=pool.filter(q=>S[q[0]]&&S[q[0]].w&&!mastered(q[0]));
 if(!pool.length){alert(mode==='wrong'?'这个范围内还没有待攻克的错题。':'这个范围内没有题目。');return}
 const pr=q=>{const s=S[q[0]];return mode==='seq'?(mastered(q[0])?1e5:0)+q[0]:(!s?1:mastered(q[0])?3:s.w?0:2)+Math.random()*.9};
 round=pool.map(q=>[pr(q),q]).sort((a,b)=>a[0]-b[0]).slice(0,N).map(x=>x[1]);
 if(mode!=='seq')round.sort(()=>Math.random()-.5);
 pos=0;score=0;miss=[];show()}

function show(){
 const q=round[pos],[id,w,r,why,ctx,trap,X]=q,c=C[chIdx(id)],multi=trap&&X;done=false;
 opts=multi?[[r,1],...X.map(x=>[x,0])]:trap?[['正确，没有语法错误',1],['句子有语法错误',0]]:[[r,1],[w,0]];
 if(!trap||multi)opts.sort(()=>Math.random()-.5);
 app.innerHTML=`<div class="top"><button class="chip" onclick="home()">← 返回</button><span>${pos+1} / ${round.length} · 答对 ${score}</span></div>
 <div class="bar"><i style="width:${pos/round.length*100}%"></i></div>
 <span class="tag">${esc(c.t)}</span><span class="tag">#${id}</span>${ctx?`<span class="tag">提示：${esc(ctx)}</span>`:''}
 <div class="q">${trap&&!multi?'下面这个句子语法正确吗？':'哪个句子是正确的？'}</div>${trap&&!multi?`<div class="card sent">${esc(w)}</div>`:''}
 ${opts.map((o,i)=>`<button class="opt" onclick="pick(${i})"><b>${'ABC'[i]}</b><span>${esc(o[0])}</span></button>`).join('')}<div id="ex"></div>`}

function pick(i){
 if(done)return;done=true;const q=round[pos],[id,w,r,why,ctx,trap,X]=q,multi=trap&&X,ok=opts[i][1]===1,s=S[id]||(S[id]={s:0,w:0,n:0});
 s.n++;if(ok){s.s++;score++}else{s.s=0;s.w++;miss.push(q)}save();
 document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(opts[k][1])b.classList.add('ok');else if(k===i)b.classList.add('bad')});
 const c=C[chIdx(id)],sib=Q.filter(x=>x[0]>=c.a&&x[0]<=c.b&&x[0]!==id&&!x[5]),at=Math.max(0,sib.findIndex(x=>x[0]>id)),more=[sib[at%sib.length],sib[(at+1)%sib.length]].filter((x,k,a)=>x&&a.indexOf(x)===k);
 $('#ex').innerHTML=`<div class="card ex"><p><b style="color:var(--${ok?'ok':'bad'})">${ok?'✅ 答对了':'❌ 答错了'}</b></p>
 ${multi?`<p class="l">正确句子</p><p class="sent">${esc(r)}</p><p class="l">其他选项错在哪</p>${X.map(x=>`<p class="sent" style="font-size:17px">${diff(x,r,'bad')}</p>`).join('')}`:trap?`<p class="why">这句话本身就是正确的。</p>`:`<p class="l">正确句子</p><p class="sent">${diff(r,w,'ok')}</p><p class="l">错误句子</p><p class="sent">${diff(w,r,'bad')}</p>`}
 <p class="l">知识点讲解</p><p class="why">${esc(why)}</p>${c.k?`<p class="l">本专题核心：${esc(c.k)}</p>`:''}
 ${more.length?`<div class="more"><span>举一反三（同专题）</span>${more.map(x=>`<p>${esc(x[2])}<br><span>${esc(x[3])}</span></p>`).join('')}</div>`:''}
 <button class="chip" onclick="speechSynthesis.cancel();speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(${JSON.stringify(r)}),{lang:'en-US',rate:.9}))">🔊 听正确句子</button></div>
 <button class="btn main" onclick="next()">${pos+1<round.length?'下一题':'查看本轮结果'}</button>`;
 $('#ex').scrollIntoView({behavior:'smooth',block:'nearest'})}

function next(){pos++;pos<round.length?show():result()}
function result(){
 const n=round.length,pct=Math.round(score/n*100),g=pct>=90?'优秀！':pct>=80?'良好':pct>=60?'及格，继续巩固':'还需加油，先看看下面的错题';
 H.push([new Date().toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}),pct,n]);H=H.slice(-30);try{localStorage.setItem('gq-h',JSON.stringify(H))}catch(e){}
 app.innerHTML=`<div class="card res" style="text-align:center"><b>${pct}<small style="font-size:18px"> 分</small></b><p class="sub" style="margin:2px 0">答对 ${score} / ${n} 题 · ${g}</p><p class="sub" style="margin:0">${miss.length?'错题已记入错题本，会优先再出现。':'本轮全对！'}</p></div>
 ${miss.length?`<h2>本轮错题（建议大声读一遍正确句子）</h2>`+miss.map(q=>`<div class="card"><div>${esc(q[5]?q[1]:q[2])}</div><div class="sub" style="margin:4px 0 0">${esc(q[3])}</div></div>`).join(''):''}
 <button class="btn main" onclick="start()">再来一轮</button><button class="btn ghost" onclick="home()">回到首页</button>`;window.scrollTo(0,0)}

document.addEventListener('keydown',e=>{if(!$('.opt'))return;const k=e.key.toLowerCase();
 const ix='abc'.indexOf(k)>=0?'abc'.indexOf(k):'123'.indexOf(k);if(!done&&k.length===1&&ix>=0&&ix<opts.length)pick(ix);else if(done&&(k==='enter'||k===' ')){e.preventDefault();next()}});
home();
</script></body></html>
